# ============================================================
#  zMRankup - Rank System Definition
#  Compatible with Paper 1.19+
# ============================================================

# Title shown when the ranks menu is opened.
menu_title: '&8&nTiempo Jugado ({page}/{max_page})&r'
# Primary command that opens this menu.
open_command:
- menuplaytime
# Register the first open_command entry as a Bukkit command.
register_command: true
# Inventory size in slots. Must be a multiple of 9.
size: 54

# Visual templates for locked, current, and available ranks.
templates:
  color-system: "&#FF1616"
  # Template for ranks that are still locked.
  locked:
    material: RED_CANDLE
    display_name: "&#FB3838⌚ &fTiempo de juego {rank_display}"
    lore:
      - ""
      - "&#26c8f9✉ Información"
      - " &8| &fRecibe recompensas extra"
      - " &8| &fsolo por jugar el servidor."
      - ""
      - "&#f9a23e⭐ Recompensas:"
      - "{rewards}"
      - ""
      - "&#5BFB1A✎ Requisitos:"
      - "{requirements}"
      - ""
      - "&#FE4224⌚ Progreso: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#47FE24■ Necesitas el rango anterior"
    glow: false

  # Template for the player's current rank.
  current:
    material: LIME_CANDLE
    glow: true
    display_name: "&#FB3838⌚ &fTiempo de juego {rank_display}"
    lore:
      - ""
      - "&#FF1616✉ Información"
      - " &8| &fRecibe recompensas extra"
      - " &8| &fsolo por jugar el servidor."
      - ""
      - "&#FF1616⭐ Recompensas:"
      - "{rewards}"
      - ""
      - "&#FF1616✎ Requisitos:"
      - "{requirements}"
      - ""
      - "&#FE4224⌚ Progreso: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#90FF4D■ Ya posees este rango"

  # Template for the next rank the player can claim.
  available:
    material: YELLOW_CANDLE
    glow: true
    display_name: "&#FB3838⌚ &fTiempo de juego {rank_display}"
    lore:
      - ""
      - "&#26c8f9✉ Información"
      - " &8| &fRecibe recompensas extra"
      - " &8| &fsolo por jugar el servidor."
      - ""
      - "&#f9a23e⭐ Recompensas:"
      - "{rewards}"
      - ""
      - "&#5BFB1A✎ Requisitos:"
      - "{requirements}"
      - ""
      - "&#FE4224⌚ Progreso: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#FFF92C■ Haz clic para reclamar"

# Menu decorations and navigation items.
items:
  # Decorative filler items for the menu edges.
  DECORATION:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    display_name: " "
    slots:
      - 0-8
      - 44-53

  # Navigation buttons shown at the bottom of the menu.
  navigation:
    previous-page:
      enabled: true
      slot: 45
      material: ARROW
      display_name: "&fNavegación &8→ &#FF1616&lATRÁS"
      lore:
        - ""
        - " &8| &fRegresa a la página"
        - " &8| &fanterior de rangos."
        - ""
        - "&#FF1616■ ¡Clic para volver!"
    next-page:
      enabled: true
      slot: 53
      material: ARROW
      display_name: "&fNavegación &8→ &#FF1616&lSIGUIENTE"
      lore:
        - ""
        - " &8| &fAvanza a la siguiente"
        - " &8| &fpágina de rangos."
        - ""
        - "&#FF1616■ ¡Clic para avanzar!"
    close:
      enabled: true
      slot: 49
      material: BARRIER
      display_name: "&fNavegación &8→ &#FF1616&lCERRAR"
      lore:
        - ""
        - " &8| &fCierra este menú"
        - " &8| &fy vuelve al principal."
        - ""
        - "&#FF1616■ ¡Clic para cerrar!"
      actions:
        - "[sound] UI_BUTTON_CLICK"
        - "[message] <gray>Cerrando menú..."
        - "[player_command] menu"
    # Static info item displayed near the top of the menu.
    info:
      enabled: true
      slot: 4
      material: BOOK
      display_name: "&fServidor &8→ &#FF1616&lMI PERFIL"
      lore:
        - ""
        - " &8| &fRango actual: %zmrankup_rank%"
        - " &8| &fSiguiente rango: %zmrankup_next_rank%"
        - " &8| &fProgreso: &a%zmrankup_progress%"
        - ""
        - " &8| &fPágina: &e{page}/{max_page}"
        - ""

