        - "give {player} gold_ingot 10"
        - "give {player} potion 3"
        - "eco give {player} 3000"
        - "lp user {player} permission set rankup.command.feed"

  9:
    material: DEFAULT
    display_rank: "&#FF1616&l9"
    page: 1
    slot: 12
    amount: 9
    list-position: 8
    # All requirements in this section must be completed to claim the rank.
    requirements:
      money:
        type: vault_balance
        amount: 25000
      placeholder_check:
        type: placeholder
        expression: "%playerpoints_points% >= 100"
