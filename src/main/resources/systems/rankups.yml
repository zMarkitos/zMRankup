        - "&#FF1616• &fAcceso a la tienda premium"
      commands:
        - "give {player} iron_chestplate 1"
        - "give {player} iron_leggings 1"
        - "give {player} iron_boots 1"
        - "give {player} iron_helmet 1"
        - "eco give {player} 5000"
        - "lp user {player} permission set rankup.shop.premium"

  10:
    material: DEFAULT
    display_rank: "&#FF1616&l10"
    page: 1
    slot: 13
    amount: 10
    list-position: 8
    # All requirements in this section must be completed to claim the rank.
    requirements:
      kills:
        type: player_kills
        amount: 4
      expression:
        type: placeholder
        expression: "%player_level% >= 40"
        display: "&fNiveles de experiencia"
