# ============================================================
#  zMRankup - Rank System Definition
#  Compatible with Paper 1.19+
# ============================================================

# Title shown when the ranks menu is opened.
menu_title: '&8&nRanks menu ({page}/{max_page})&r'
# Primary command that opens this menu.
open_command:
- menuranks
# Register the first open_command entry as a Bukkit command.
register_command: true
# Inventory size in slots. Must be a multiple of 9.
size: 54

# Visual templates for locked, current, and available ranks.
templates:
  color-system: "&#FF1616"
  # Template for ranks that are still locked.
  locked:
    material: RED_STAINED_GLASS_PANE
    display_name: "&fRank &8→ {rank_display}"
    lore:
      - ""
      - "&#FF1616✉ Information"
      - " &8| &fIncrease your prestige to"
      - " &8| &funlock unique rewards."
      - ""
      - "&#FF1616⭐ Rewards:"
      - "{rewards}"
      - ""
      - "&#FF1616✎ Requirements:"
      - "{requirements}"
      - ""
      - "&#FF1616⌚ Progress: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#F86767■ You need the previous rank"
    glow: false

  # Template for the player's current rank.
  current:
    material: LIME_STAINED_GLASS_PANE
    glow: true
    display_name: "&fRank &8→ {rank_display}"
    lore:
      - ""
      - "&#FF1616✉ Information"
      - " &8| &fIncrease your prestige to"
      - " &8| &funlock unique rewards."
      - ""
      - "&#FF1616⭐ Rewards:"
      - "{rewards}"
      - ""
      - "&#FF1616✎ Requirements:"
      - "{requirements}"
      - ""
      - "&#FF1616⌚ Progress: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#90FF4D■ You already have this rank"

  # Template for the next rank the player can claim.
  available:
    material: YELLOW_STAINED_GLASS_PANE
    glow: true
    display_name: "&fRank &8→ {rank_display}"
    lore:
      - ""
      - "&#FF1616✉ Information"
      - " &8| &fIncrease your prestige to"
      - " &8| &funlock unique rewards."
      - ""
      - "&#FF1616⭐ Rewards:"
      - "{rewards}"
      - ""
      - "&#FF1616✎ Requirements:"
      - "{requirements}"
      - ""
      - "&#FF1616⌚ Progress: &7&o({progress}%)"
      - "{progress_bar}"
      - ""
      - "&#FFF92C■ Click to claim"

# Menu decorations and navigation items.
items:
  # Decorative filler items for the menu edges.
  DECORATION:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    display_name: " "
    slots:
      - 0-8
      - 44-53

  # Navigation buttons shown at the bottom of the menu.
  navigation:
    previous-page:
      enabled: true
      slot: 45
      material: ARROW
      display_name: "&fNavigation &8→ &#FF1616&lBACK"
      lore:
        - ""
        - " &8| &fReturn to the previous"
        - " &8| &fpage of ranks."
        - ""
        - "&#FF1616■ Click to go back!"
    next-page:
      enabled: true
      slot: 53
      material: ARROW
      display_name: "&fNavigation &8→ &#FF1616&lNEXT"
      lore:
        - ""
        - " &8| &fAdvance to the next"
        - " &8| &fpage of ranks."
        - ""
        - "&#FF1616■ Click to advance!"
    close:
      enabled: true
      slot: 49
      material: BARRIER
      display_name: "&fNavigation &8→ &#FF1616&lCLOSE"
      lore:
        - ""
        - " &8| &fClose this menu"
        - " &8| &fand return to the main one."
        - ""
        - "&#FF1616■ Click to close!"
      actions:
        - "[sound] UI_BUTTON_CLICK"
        - "[message] <gray>Closing menu..."
        - "[player_command] menu"
    # Static info item displayed near the top of the menu.
    info:
      enabled: true
      slot: 4
      material: BOOK
      display_name: "&fServer &8→ &#FF1616&lMY PROFILE"
      lore:
        - ""
        - " &8| &fCurrent rank: %zmrankup_rankups_rank%"
        - " &8| &fNext rank: %zmrankup_rankups_next_rank%"
        - " &8| &fProgress: &a%zmrankup_rankups_progress%"
        - ""
        - " &8| &fPage: &e{page}/{max_page}"
        - ""

# Ranks are ordered by file position.
# Each rank defines a slot, requirements, and rewards.
ranks:
  1:
    material: DEFAULT
    display_rank: "&#FF1616&l1"
    permission-group: 1
    page: 1
    slot: 10
    amount: 1
    list-position: 8
    requirements:
      money:
        type: vault_balance
        amount: 5000
    rewards:
      displays:
        - "&#FF1616• &fStarter kit (stone sword, bread)"
        - "&#FF1616• &f150 welcome coins"
        - "&#FF1616• &fTemporary /fly access (1 hour)"
      commands:
        - "give {player} stone_sword 1"
        - "give {player} bread 16"
        - "eco give {player} 150"
        - "lp user {player} permission settemp aircore.command.fly true 1h"

