#
# Spanish message file.
# Missing keys are merged in automatically from the bundled defaults.
#

# ===========================
# Player messages
# ===========================

no-permission: "{prefix}<red>No tienes permiso para hacer esto."
console-only: "{prefix}<red>Este comando solo puede ser ejecutado por un jugador."
usage: "{prefix}&fUso correcto: &e{usage}"
cooldown: "{prefix}&fDebes esperar &e{time} &fantes de intentar de nuevo."

# ===========================
# Rankup
# ===========================

rankup-success: "{prefix}&fSubiste de rango a &e{rank}&f."
rankup-fail: "{prefix}&cNo cumples los requisitos para subir de rango."
rankup-max: "{prefix}&fYa estás en el rango máximo."
rankup-max-prestige-available: "{prefix}&fEstás en el rango máximo. &e¡Usa el prestigio para continuar!"
already-at-rank: "{prefix}&fYa te encuentras en este rango."
not-enough-money: "{prefix}&fDinero insuficiente. Necesitas &e{amount}&f."
not-enough-requirements: "{prefix}&fNo cumples todos los requisitos."
rank-not-found: "{prefix}&fEl rango &e{rank} &fno existe."
player-not-found: "{prefix}&fEl jugador &e{player} &fno fue encontrado."

# ===========================
# Auto rankup
# ===========================

auto-rankup-complete: "{prefix}&fAuto-rankup completado. &e{count} &frango(s) reclamados."
auto-rankup-enabled: "{prefix}&fAuto-rankup &eactivado&f."
auto-rankup-disabled: "{prefix}&fAuto-rankup &edesactivado&f."

# ===========================
# Prestige
# ===========================

prestige-success: "{prefix}&f¡Prestigiaste! Ahora eres &e{prestige}&f."
prestige-menu-success: "{prefix}&f¡Prestigio reclamado! Sube de rango para el siguiente nivel."
prestige-menu-fail: "{prefix}&cNo cumples los requisitos para prestigiar."

# ===========================
# Update
# ===========================

update-title: "{prefix}<#4FF808><b>ACTUALIZACIÓN</b>"
update-subtitle: "{prefix}&f¡La versión &e{latest_version} &festá disponible!"
update-available: "{prefix}\n<dark_gray>[<red>zMRankup<dark_gray>] &fNueva versión disponible: &e{current_version} &f→ &e{latest_version}\n"
update-links: "{prefix}&fDescárgalo en: <aqua><u>{version_url}</u>"

# ===========================
# Admin
# ===========================

config-reloaded: "{prefix}&aConfiguración recargada correctamente."
rank-set: "{prefix}&fRango de &e{player} &festablecido a &e{rank}&f."
rank-reset: "{prefix}&fDatos de rango de &e{player} &freiniciados."

admin-system-not-found: "{prefix}&cSistema &e{system} &cno encontrado."
admin-rank-not-found: "{prefix}&cEl rango &e{rank} &cno existe en el sistema &e{system}&c."
admin-rank-set: "{prefix}&fRango de &e{player} &fen &e{system} &f→ &e{rank}&f."
admin-rank-reset: "{prefix}&fRango de &e{player} &fen &e{system} &freiniciado."
admin-prestige-level-not-found: "{prefix}&cEl nivel &e{level} &cno existe en &e{system} &c(máximo: &e{max}&c)."
admin-prestige-updated: "{prefix}&fPrestigio de &e{player} &fen &e{system} &ffue actualizado."

admin-version-checking: "{prefix}&eComprobando versión..."
admin-version-latest: |
  {prefix}&a¡Estás usando la última versión!
  &fActual: &e{current_version}
  &fSpigotMC: &b<u><click:open_url:'{spigot_url}'>{spigot_url}</click></u>
admin-version-update: |
  {prefix}&e¡Hay una actualización disponible!
  &fActual: &c{current_version} &f-> Nueva: &a{latest_version}
  &fDescargar: &b<u><click:open_url:'{spigot_url}'>{spigot_url}</click></u>

placeholder-none: "0"

admin-usage: |
  <dark_gray>[<red>zMRankup<dark_gray>] &fComandos de administración:
  <dark_gray> │
  <dark_gray> ├ &e/zmrankup admin set &f<jugador> <sistema> <rango>
  <dark_gray> ├ &e/zmrankup admin reset &f<jugador> <sistema>
  <dark_gray> ├ &e/zmrankup admin prestige set &f<jugador> <sistema> <nivel> [reset_rank]
  <dark_gray> ├ &e/zmrankup admin prestige reset &f<jugador> <sistema>
  <dark_gray> ├ &e/zmrankup admin reload
  <dark_gray> └ &e/zmrankup admin version

requirements:
  default-lore:
    empty: "&c¡Sin requisitos!"
    format: " {color_system}• {display} &7({progress}) {status}"
    status-met: "&#4FF808&l✔"
    status-unmet: "&#FD3418&l✘"
  display:
    vault_balance: "&fTener &#97FF1C{amount} &fde dinero"
    playtime_hours: "&fHaber jugado %zmrankups_color-system_{position}%{amount} horas ⌚"
    playtime_minutes: "&fHaber jugado %zmrankups_color-system_{position}%{amount} minutos ⌚"
    permission: "&fRequerir permiso: &#FFD966{permission}"
    mob_kills: "&fMatar &#FF6B6B{amount}&f{mob_suffix}"
    player_kills: "&fAsesinar &#FF4444{amount} &fjugadores"
    deaths: "&fMorir &#AA66FF{amount} &fveces"
    blocks_mined: "&fMinar &#66FFAA{amount}&f{block_suffix}"
    placeholder: "&f{name}: &#FFDD88{amount}"
    generic_blocks: " bloques"
    generic_mobs: " mobs"
    rankup_rank: "&fRango requerido: %zmrankups_color-system_{position}%{value} &fen %zmrankups_color-system_{position}%{system}"

