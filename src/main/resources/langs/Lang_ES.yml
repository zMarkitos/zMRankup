#
# Spanish message file.
# Missing keys are merged in automatically from the bundled defaults.
#

no-permission: "{prefix}<red>No tienes permiso para hacer esto."
rankup-success: "{prefix}<green>¡Has subido al rango {rank}!"
rankup-fail: "{prefix}<red>No cumples los requisitos para subir de rango."
rankup-max: "{prefix}<yellow>Ya estás en el rango máximo."
auto-rankup-complete: "{prefix}<green>Has reclamado {count} rankups automáticamente."
not-enough-money: "{prefix}<red>No tienes suficiente dinero. Necesitas <gold>{amount}<red>."
not-enough-requirements: "{prefix}<red>No cumples todos los requisitos."
rank-not-found: "{prefix}<red>El rango '{rank}' no existe."
player-not-found: "{prefix}<red>El jugador '{player}' no fue encontrado."
config-reloaded: "{prefix}<green>Configuración recargada correctamente."
rank-set: "{prefix}<green>Rango de <gold>{player}<green> establecido a <gold>{rank}<green>."
rank-reset: "{prefix}<green>Datos de <gold>{player}<green> reiniciados."
already-at-rank: "{prefix}<yellow>Ya estás en este rango."
auto-rankup-enabled: "{prefix}<green>Auto-rankup activado."
auto-rankup-disabled: "{prefix}<red>Auto-rankup desactivado."
cooldown: "{prefix}<red>Debes esperar <gold>{time}<red> antes de intentar de nuevo."
console-only: "{prefix}<red>Este comando solo puede ser ejecutado por un jugador."
usage: "{prefix}<yellow>Uso: {usage}"
update-title: "<#4FF808><b>ACTUALIZACIÓN</b>"
update-subtitle: "<gray>¡La versión <white>{latest_version} <gray>está disponible!"
update-available: "\n{prefix}<green>¡Hay una nueva versión de zMRankup disponible! <gray>({current_version} -> {latest_version})\n"
update-links: "{prefix}<yellow>Descárgalo aquí: <aqua><u>{version_url}</u>"
admin-usage: |
  <gold>━━━ zMRankup Admin ━━━
  <yellow>/zmrankups admin reload <gray>-> Recargar configuración
  <yellow>/zmrankups admin version <gray>-> Ver actualizaciones
  <yellow>/zmrankups admin add <user> <system> <rango> <gray>-> Dar siguiente rango
  <yellow>/zmrankups admin set <user> <system> <rango> <gray>-> Establecer rango
  <yellow>/zmrankups admin remove <user> <system> <gray>-> Quitar rango
  <yellow>/zmrankups admin reset <user> <system> <gray>-> Reiniciar datos

requirements:
  # Default lore formatting used when rank requirements are rendered in menus.
  default-lore:
    empty: "&c¡Sin requisitos!"
    format: " {color_system}• {display} &7({progress}) {status}"
    status-met: "&#4FF808&l✔"
    status-unmet: "&#FD3418&l✘"
  # Friendly names for requirement values shown in menus and messages.
  display:
    vault_balance: "&fTener &#97FF1C{amount} &fde dinero"
    playtime_hours: "&fHaber jugado %zmrankups_color-system_{position}%{amount} horas ⌚"
    playtime_minutes: "&fHaber jugado %zmrankups_color-system_{position}%{amount} minutos ⌚"
    permission: "&fRequerir permiso: &#FFD966{permission}"
    mob_kills: "&fMatar &#FF6B6B{amount}&f{mob_suffix}"
    player_kills: "&fAsesinar &#FF4444{amount} &fjugadores"
    deaths: "&fMorir &#AA66FF{amount} &fveces"
    blocks_mined: "&fMinar &#66FFAA{amount}&f{block_suffix}"
    placeholder: "&f{name}: &#FFDD88{amount}"
    generic_blocks: " bloques"
    generic_mobs: " mobs"

