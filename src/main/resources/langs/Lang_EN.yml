#
# English message file.
# Missing keys are merged in automatically from the bundled defaults.
#

no-permission: "{prefix}<red>You don't have permission to do this."
rankup-success: "{prefix}<green>You have ranked up to {rank}!"
rankup-fail: "{prefix}<red>You do not meet the requirements to rank up."
rankup-max: "{prefix}<yellow>You are already at the maximum rank."
auto-rankup-complete: "{prefix}<green>You have automatically claimed {count} rankup(s)."
not-enough-money: "{prefix}<red>You don't have enough money. You need <gold>{amount}<red>."
not-enough-requirements: "{prefix}<red>You don't meet all the requirements."
rank-not-found: "{prefix}<red>The rank '{rank}' does not exist."
player-not-found: "{prefix}<red>The player '{player}' was not found."
config-reloaded: "{prefix}<green>Configuration reloaded successfully."
rank-set: "{prefix}<green>Rank of <gold>{player}<green> set to <gold>{rank}<green>."
rank-reset: "{prefix}<green>Data of <gold>{player}<green> reset."
already-at-rank: "{prefix}<yellow>You are already at this rank."
auto-rankup-enabled: "{prefix}<green>Auto-rankup enabled."
auto-rankup-disabled: "{prefix}<red>Auto-rankup disabled."
cooldown: "{prefix}<red>You must wait <gold>{time}<red> before trying again."
console-only: "{prefix}<red>This command can only be executed by a player."
usage: "{prefix}<yellow>Usage: {usage}"
update-title: "<#4FF808><b>UPDATE AVAILABLE</b>"
update-subtitle: "<gray>Version <white>{latest_version} <gray>is out!"
update-available: "\n{prefix}<green>A new version of zMRankup is available! <gray>({current_version} -> {latest_version})\n"
update-links: "{prefix}<yellow>Download here: <aqua><u>{version_url}</u>"
admin-usage: |
  {prefix}<gold>━━━ zMRankup Admin ━━━
  <yellow>/zmrankups admin reload <gray>-> Reload configuration
  <yellow>/zmrankups admin version <gray>-> Check updates
  <yellow>/zmrankups admin add <user> <system> <rank> <gray>-> Add rank
  <yellow>/zmrankups admin set <user> <system> <rank> <gray>-> Set specific rank
  <yellow>/zmrankups admin remove <user> <system> <gray>-> Remove rank
  <yellow>/zmrankups admin reset <user> <system> <gray>-> Reset data

requirements:
  # Default lore formatting used when rank requirements are rendered in menus.
  default-lore:
    empty: "&cNo requirements!"
    format: " {color_system}• {display} &7({progress}) {status}"
    status-met: "&#4FF808&l✔"
    status-unmet: "&#FD3418&l✘"
  # Friendly names for requirement values shown in menus and messages.
  display:
    vault_balance: "&fHave &#97FF1C{amount} &fmoney"
    playtime_hours: "&fPlayed for %zmrankups_color-system_{position}%{amount} hours ⌚"
    playtime_minutes: "&fPlayed for %zmrankups_color-system_{position}%{amount} minutes ⌚"
    permission: "&fRequire permission: &#FFD966{permission}"
    mob_kills: "&fKill &#FF6B6B{amount}&f{mob_suffix}"
    player_kills: "&fKill &#FF4444{amount} &fplayers"
    deaths: "&fDie &#AA66FF{amount} &ftimes"
    blocks_mined: "&fMine &#66FFAA{amount}&f{block_suffix}"
    placeholder: "{name}: {amount}"
    generic_blocks: " blocks"
    generic_mobs: " mobs"

