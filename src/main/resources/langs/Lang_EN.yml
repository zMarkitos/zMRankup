#
# English message file.
# Missing keys are merged in automatically from the bundled defaults.
#

# ===========================
# Player messages
# ===========================

no-permission: "{prefix}<red>You don't have permission to do this."
console-only: "{prefix}<red>This command can only be executed by a player."
usage: "{prefix}&fCorrect usage: &e{usage}"
cooldown: "{prefix}&fYou must wait &e{time} &fbefore trying again."

# ===========================
# Rankup
# ===========================

rankup-success: "{prefix}&fYou ranked up to &e{rank}&f."
rankup-fail: "{prefix}&cYou do not meet the requirements to rank up."
rankup-max: "{prefix}&fYou are already at the maximum rank."
rankup-max-prestige-available: "{prefix}&fYou are at the maximum rank. &eUse prestige to continue!"
already-at-rank: "{prefix}&fYou are already at this rank."
not-enough-money: "{prefix}&fInsufficient money. You need &e{amount}&f."
not-enough-requirements: "{prefix}&fYou do not meet all the requirements."
rank-not-found: "{prefix}&fThe rank &e{rank} &fdoes not exist."
player-not-found: "{prefix}&fThe player &e{player} &fwas not found."

# ===========================
# Auto rankup
# ===========================

auto-rankup-complete: "{prefix}&fAuto-rankup completed. &e{count} &frank(s) claimed."
auto-rankup-enabled: "{prefix}&fAuto-rankup &eenabled&f."
auto-rankup-disabled: "{prefix}&fAuto-rankup &edisabled&f."

# ===========================
# Prestige
# ===========================

prestige-success: "{prefix}&fYou prestiged! You are now &e{prestige}&f."
prestige-menu-success: "{prefix}&fPrestige claimed! Rank up for the next level."
prestige-menu-fail: "{prefix}&cYou do not meet the requirements to prestige."

# ===========================
# Update
# ===========================

update-title: "{prefix}<#4FF808><b>UPDATE</b>"
update-subtitle: "{prefix}&fVersion &e{latest_version} &fis available!"
update-available: "{prefix}\n<dark_gray>[<red>zMRankup<dark_gray>] &fNew version available: &e{current_version} &f→ &e{latest_version}\n"
update-links: "{prefix}&fDownload at: <aqua><u>{version_url}</u>"

# ===========================
# Admin
# ===========================

config-reloaded: "{prefix}&aConfiguration reloaded successfully."
rank-set: "{prefix}&fRank of &e{player} &fset to &e{rank}&f."
rank-reset: "{prefix}&fRank data of &e{player} &freset."

admin-system-not-found: "{prefix}&cSystem &e{system} &cnot found."
admin-rank-not-found: "{prefix}&cThe rank &e{rank} &cdoes not exist in system &e{system}&c."
admin-rank-set: "{prefix}&fRank of &e{player} &fin &e{system} &f→ &e{rank}&f."
admin-rank-reset: "{prefix}&fRank of &e{player} &fin &e{system} &freset."
admin-prestige-level-not-found: "{prefix}&cThe level &e{level} &cdoes not exist in &e{system} &c(max: &e{max}&c)."
admin-prestige-updated: "{prefix}&fPrestige of &e{player} &fin &e{system} &ffue actualizado."

admin-version-checking: "{prefix}&eChecking version..."
admin-version-latest: |
  {prefix}&aYou are running the latest version!
  &fCurrent: &e{current_version}
  &fSpigotMC: &b<u><click:open_url:'{spigot_url}'>{spigot_url}</click></u>
admin-version-update: |
  {prefix}&eAn update is available!
  &fCurrent: &c{current_version} &f-> Latest: &a{latest_version}
  &fDownload: &b<u><click:open_url:'{spigot_url}'>{spigot_url}</click></u>

placeholder-none: "0"

admin-usage: |
  <dark_gray>[<red>zMRankup<dark_gray>] &fAdmin commands:
  <dark_gray> │
  <dark_gray> ├ &e/zmrankup admin set &f<player> <system> <rank>
  <dark_gray> ├ &e/zmrankup admin reset &f<player> <system>
  <dark_gray> ├ &e/zmrankup admin prestige set &f<player> <system> <level> [reset_rank]
  <dark_gray> ├ &e/zmrankup admin prestige reset &f<player> <system>
  <dark_gray> ├ &e/zmrankup admin reload
  <dark_gray> └ &e/zmrankup admin version

requirements:
  default-lore:
    empty: "&cNo requirements!"
    format: " {color_system}• {display} &7({progress}) {status}"
    status-met: "&#4FF808&l✔"
    status-unmet: "&#FD3418&l✘"
  display:
    vault_balance: "&fHave &#97FF1C{amount} &fmoney"
    playtime_hours: "&fHave played %zmrankups_color-system_{position}%{amount} hours ⌚"
    playtime_minutes: "&fHave played %zmrankups_color-system_{position}%{amount} minutes ⌚"
    permission: "&fRequire permission: &#FFD966{permission}"
    mob_kills: "&fKill &#FF6B6B{amount}&f{mob_suffix}"
    player_kills: "&fKill &#FF4444{amount} &fplayers"
    deaths: "&fDie &#AA66FF{amount} &ftimes"
    blocks_mined: "&fMine &#66FFAA{amount}&f{block_suffix}"
    placeholder: "&f{name}: &#FFDD88{amount}"
    generic_blocks: " blocks"
    generic_mobs: " mobs"
    rankup_rank: "&fRequired rank: %zmrankups_color-system_{position}%{value} &fin %zmrankups_color-system_{position}%{system}"

